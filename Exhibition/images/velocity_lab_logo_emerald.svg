<svg xmlns="http://www.w3.org/2000/svg" viewBox="65 185 1230 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- V Frame Gradients (Velocity Green) -->
    <linearGradient id="vl_vOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38d954" />
      <stop offset="50%" stop-color="#64f642" />
      <stop offset="100%" stop-color="#25b847" />
    </linearGradient>

    <linearGradient id="vl_vBevelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ec94e" />
      <stop offset="55%" stop-color="#179b44" />
      <stop offset="100%" stop-color="#12823b" />
    </linearGradient>

    <linearGradient id="vl_vCoreBright" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#9dff29" />
      <stop offset="50%" stop-color="#7dfa30" />
      <stop offset="100%" stop-color="#3cd83e" />
    </linearGradient>

    <!-- L Outer Metallic + Emerald Accent Ring -->
    <linearGradient id="vl_lOuter" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#cfd5db" />
      <stop offset="45%" stop-color="#9ea6ae" />
      <stop offset="70%" stop-color="#7dfa30" />
      <stop offset="100%" stop-color="#25b847" />
    </linearGradient>

    <linearGradient id="vl_lBevelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4cacf" />
      <stop offset="50%" stop-color="#8c939a" />
      <stop offset="100%" stop-color="#6d737a" />
    </linearGradient>

    <linearGradient id="vl_lCoreBright" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#ebeff2" />
      <stop offset="70%" stop-color="#b4bbc2" />
      <stop offset="100%" stop-color="#d9dde2" />
    </linearGradient>

    <!-- Lightning Bolt Gradients -->
    <linearGradient id="vl_boltOuter" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e5ff24" />
      <stop offset="45%" stop-color="#c8ff29" />
      <stop offset="100%" stop-color="#5ff535" />
    </linearGradient>

    <linearGradient id="vl_boltInner" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#abff4f" />
      <stop offset="60%" stop-color="#19b347" />
      <stop offset="100%" stop-color="#48e83a" />
    </linearGradient>

    <!-- "LAB" Typography Gradient -->
    <linearGradient id="vl_labText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dfa30" />
      <stop offset="50%" stop-color="#00e599" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="vl_auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Dark Aura Glow -->
  <circle cx="330" cy="370" r="160" fill="rgba(0, 229, 153, 0.35)" filter="url(#vl_auraGlow)" opacity="0.3" pointer-events="none" />

  <!-- 1. LEFT ICON EMBLEM: V - LIGHTNING BOLT - L -->
  <g id="vl_emblem">
    <!-- Outer Frame of "V" -->
    <polygon fill="url(#vl_vOuter)" points="409,224 376,256 283,256 243,338 216,256 80,257 136,313 193,511 269,511 323,406 284,485 330,392 313,406 263,503 199,503 143,307 101,266 209,264 241,362 289,264 379,264" />

    <!-- Inner 3D Beveled "V" -->
    <polygon fill="url(#vl_vBevelDark)" points="128,275 153,306 205,491 258,493 302,408 271,401 369,275 293,275 238,391 204,276" />
    <polygon fill="url(#vl_vCoreBright)" points="146,284 197,284 236,416 299,284 352,284 260,402 287,406 250,478 216,478 166,302" />
    <polygon fill="#75fa3b" opacity="0.75" points="128,275 204,276 197,284 146,284" />
    <polygon fill="#75fa3b" opacity="0.75" points="293,275 369,275 352,284 299,284" />

    <!-- Outer Metallic & Theme Frame of "L" -->
    <polygon fill="url(#vl_lOuter)" points="523,256 431,257 396,339 426,238 386,343 404,338 436,263 512,265 392,435 532,441 509,500 345,504 373,433 307,516 348,474 335,510 514,510 544,432 457,428" />

    <!-- Inner 3D Beveled Metallic "L" -->
    <polygon fill="url(#vl_lBevelDark)" points="442,276 417,340 446,341 399,401 363,492 500,492 517,451 428,450 496,275" />
    <polygon fill="url(#vl_lCoreBright)" points="450,286 483,286 416,460 503,460 493,482 378,482 408,405 457,341 428,340" />
    <polygon fill="#ffffff" opacity="0.55" points="450,286 483,286 463,340 408,405 457,341 428,340" />

    <!-- Central High-Voltage Lightning Bolt -->
    <polygon fill="url(#vl_boltOuter)" points="444,199 292,390 341,395 264,550 422,354 376,346" />
    <polygon fill="url(#vl_boltInner)" points="422,232 306,383 353,387 283,522 405,361 359,354" />
    <polygon fill="#f4ff8a" opacity="0.9" points="422,232 359,354 376,346 444,199" />
    <polygon fill="#ffffff" opacity="0.85" points="376,296 337,360 353,360 386,306" />
  </g>

  <!-- 2. RIGHT TYPOGRAPHY LOCKUP ("VELOCITY LAB" + SUBTEXT) -->
  <g id="vl_typography">
