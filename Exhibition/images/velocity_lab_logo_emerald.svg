    <path fill="#ffffff" fill-rule="evenodd" d="M 651.8,325.9 L 633.0,327.4 L 604.4,379.5 L 604.0,326.5 L 586.0,326.1 L 588.2,404.0 L 608.0,403.4 Z M 709.6,326.0 L 659.0,326.6 L 638.1,404.0 L 689.2,403.5 L 692.8,387.8 L 660.4,386.6 L 664.6,372.1 L 690.2,371.6 L 694.9,356.8 L 669.8,356.2 L 671.0,347.9 L 662.2,342.1 L 704.4,342.0 Z M 721.8,325.9 L 699.8,403.4 L 747.9,404.1 L 752.6,388.0 L 722.8,387.2 L 738.9,326.6 Z M 827.6,328.8 L 820.4,325.8 L 790.2,325.8 L 782.8,327.8 L 776.8,332.4 L 771.8,342.8 L 759.8,386.8 L 759.6,396.6 L 762.8,401.4 L 769.6,404.1 L 801.2,404.1 L 813.1,398.1 L 819.1,386.8 L 831.1,340.9 L 831.1,334.1 Z M 810.9,342.4 L 811.6,347.0 L 800.5,386.4 L 797.0,387.9 L 779.5,387.5 L 778.2,384.8 L 790.0,343.8 L 794.6,341.6 Z M 895.4,328.8 L 887.6,325.8 L 859.6,325.8 L 846.6,331.8 L 828.8,386.6 L 831.5,401.2 L 838.6,404.2 L 868.8,404.1 L 880.4,397.8 L 887.8,375.6 L 871.1,375.9 L 866.4,387.6 L 849.4,387.6 L 848.2,382.1 L 859.2,343.5 L 878.2,342.2 L 877.6,354.5 L 894.2,354.8 L 898.9,338.8 Z M 930.4,325.9 L 912.8,326.9 L 891.8,401.1 L 892.2,404.1 L 908.4,404.2 L 910.1,402.8 Z M 995.4,326.0 L 939.8,326.4 L 935.9,341.1 L 953.9,342.9 L 937.6,404.0 L 955.1,403.5 L 969.8,346.9 L 960.9,341.9 L 989.5,341.5 Z M 1061.6,326.1 L 1044.0,326.4 L 1021.2,358.4 L 1016.0,326.5 L 998.0,326.4 L 1006.2,377.2 L 999.8,404.0 L 1017.2,403.6 L 1024.5,378.4 Z" />

    <!-- "LAB" -->
    <path fill="url(#vl_labText)" fill-rule="evenodd" d="M 1111.1,326.2 L 1093.6,327.2 L 1073.0,404.0 L 1116.5,404.2 L 1121.4,402.4 L 1124.5,388.4 L 1089.0,387.2 L 1098.0,379.5 Z M 1197.0,326.2 L 1173.5,326.9 L 1128.0,403.9 L 1146.5,404.0 L 1156.5,388.5 L 1180.1,388.6 L 1181.2,403.9 L 1200.1,403.5 Z M 1180.8,345.0 L 1181.2,349.0 L 1180.5,369.6 L 1177.1,371.4 L 1170.2,373.4 L 1160.2,375.4 L 1165.9,370.2 L 1178.5,347.8 Z M 1277.8,328.5 L 1271.0,325.8 L 1228.6,326.5 L 1207.4,403.8 L 1250.4,404.0 L 1258.1,402.1 L 1265.2,396.8 L 1272.2,377.9 L 1272.4,369.2 L 1269.6,363.9 L 1277.1,354.4 L 1281.0,341.0 L 1281.0,333.8 Z M 1234.0,372.0 L 1235.1,371.2 L 1251.4,371.2 L 1253.2,371.9 L 1254.2,374.2 L 1251.2,386.0 L 1249.0,387.8 L 1246.6,388.2 L 1230.6,387.9 L 1230.1,387.4 L 1230.5,383.9 Z M 1236.2,341.9 L 1239.5,341.2 L 1260.4,341.5 L 1261.6,342.5 L 1261.9,344.0 L 1259.5,352.9 L 1258.0,355.0 L 1256.0,355.8 L 1239.6,355.5 L 1239.2,353.9 L 1240.5,346.5 Z" />

    <!-- "ATHLETE EVALUATION SYSTEM" -->
    <text x="586" y="448" fill="#00E599" style="font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 900; letter-spacing: 0.24em; text-transform: uppercase;">ATHLETE EVALUATION SYSTEM</text>
  </g>
</svg>
