<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="100%" height="100%">
  <defs>
    <!-- Outer V Frame Orange Gradient -->
    <linearGradient id="vOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f25c19" />
      <stop offset="50%" stop-color="#ff851b" />
      <stop offset="100%" stop-color="#d63a0d" />
    </linearGradient>

    <!-- Inner V Dark Crimson-Orange Bevel Gradient -->
    <linearGradient id="vBevelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e04812" />
      <stop offset="55%" stop-color="#b82509" />
      <stop offset="100%" stop-color="#8f1806" />
    </linearGradient>

    <!-- Inner V Bright Orange Core Gradient -->
    <linearGradient id="vCoreBright" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff9e1b" />
      <stop offset="50%" stop-color="#ff7b08" />
      <stop offset="100%" stop-color="#e85305" />
    </linearGradient>

    <!-- Outer L Frame Metallic + Orange Accent Gradient -->
    <linearGradient id="lOuterGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#cfd5db" />
      <stop offset="45%" stop-color="#9ea6ae" />
      <stop offset="65%" stop-color="#ff9424" />
      <stop offset="100%" stop-color="#f05a10" />
    </linearGradient>

    <!-- Inner L Base Metallic Shadow Gradient -->
    <linearGradient id="lBevelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4cacf" />
      <stop offset="50%" stop-color="#8c939a" />
      <stop offset="100%" stop-color="#6d737a" />
    </linearGradient>

    <!-- Inner L Bright Silver Facet Gradient -->
    <linearGradient id="lCoreBright" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#ebeff2" />
      <stop offset="70%" stop-color="#b4bbc2" />
      <stop offset="100%" stop-color="#d9dde2" />
    </linearGradient>

    <!-- Lightning Bolt Outer Gold-Yellow Gradient -->
    <linearGradient id="boltOuterGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffe033" />
      <stop offset="45%" stop-color="#ffbd1f" />
      <stop offset="100%" stop-color="#ff6f08" />
    </linearGradient>

    <!-- Lightning Bolt Inner Fiery Orange Core Gradient -->
    <linearGradient id="boltInnerGrad" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#fff799" />
      <stop offset="25%" stop-color="#ffaa1c" />
      <stop offset="60%" stop-color="#e64607" />
      <stop offset="100%" stop-color="#ff7b0a" />
    </linearGradient>

    <!-- "LAB" Text Vibrant Orange Gradient -->
    <linearGradient id="labTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6e14" />
      <stop offset="50%" stop-color="#f75b08" />
      <stop offset="100%" stop-color="#d94602" />
    </linearGradient>
  </defs>

  <!-- Dark Background (Delete or comment out the <rect> below for a 100% transparent background) -->
  <rect width="1376" height="768" fill="#1b222a" />

  <!-- ==================== LEFT ICON: V - LIGHTNING - L ==================== -->
  <g id="velocity-lab-emblem">
    <!-- 1. Outer Orange Frame of "V" -->
    <polygon fill="url(#vOuterGrad)" points="
      409,224 376,256 283,256 243,338 216,256 80,257 136,313 193,511 269,511 
      323,406 284,485 330,392 313,406 263,503 199,503 143,307 101,266 209,264 
      241,362 289,264 379,264
    " />

    <!-- 2. Inner 3D Beveled "V" -->
    <!-- Base Dark Crimson-Orange Bevel -->
    <polygon fill="url(#vBevelDark)" points="
      128,275 153,306 205,491 258,493 302,408 271,401 369,275 293,275 238,391 204,276
    " />
    <!-- Bright Orange Inner Core Facet -->
    <polygon fill="url(#vCoreBright)" points="
      146,284 197,284 236,416 299,284 352,284 260,402 287,406 250,478 216,478 166,302
    " />
    <!-- Top Bevel Highlight Strips -->
    <polygon fill="#ffad33" opacity="0.7" points="128,275 204,276 197,284 146,284" />
    <polygon fill="#ffad33" opacity="0.7" points="293,275 369,275 352,284 299,284" />

    <!-- 3. Outer Metallic & Orange Frame of "L" -->
    <polygon fill="url(#lOuterGrad)" points="
      523,256 431,257 396,339 426,238 386,343 404,338 436,263 512,265 
      445,435 532,441 509,500 345,504 373,433 307,516 348,474 335,510 
      514,510 544,432 457,428
    " />

    <!-- 4. Inner 3D Beveled Metallic "L" -->
    <!-- Base Metallic Shadow Bevel -->
    <polygon fill="url(#lBevelDark)" points="
      442,276 417,340 446,341 399,401 363,492 500,492 517,451 428,450 496,275
    " />
    <!-- Bright Silver Inner Facet -->
    <polygon fill="url(#lCoreBright)" points="
      450,286 483,286 416,460 503,460 493,482 378,482 408,405 457,341 428,340
    " />
    <!-- Specular Diagonal Sheen on "L" -->
    <polygon fill="#ffffff" opacity="0.5" points="
      450,286 483,286 463,340 408,405 457,341 428,340
    " />

    <!-- 5. Central High-Voltage Orange/Gold Lightning Bolt -->
    <!-- Outer Gold-Yellow Bevel -->
    <polygon fill="url(#boltOuterGrad)" points="
      444,199 292,390 341,395 264,550 422,354 376,346
    " />
    <!-- Inner Fiery Orange Core Facet -->
    <polygon fill="url(#boltInnerGrad)" points="
      422,232 306,383 353,387 283,522 405,361 359,354
    " />
    <!-- Center Specular Ridge Highlight -->
    <polygon fill="#fff6a1" opacity="0.9" points="
      422,232 359,354 376,346 444,199
    " />
    <polygon fill="#ffffff" opacity="0.8" points="
      376,296 337,360 353,360 386,306
    " />
  </g>

